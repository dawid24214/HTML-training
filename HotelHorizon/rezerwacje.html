<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rezerwacje</title>
</head>
<body>
<nav>
    <h1><span>Hotel Horizon</span><br>Odpoczynek na który zasługujesz</h1>
    <ul>
        <li><a href="index.html">Strona główna</a></li>
        <li><a href="pokoje.html">Pokoje</a></li>
        <li><a href="rezerwacje.html">Rezerwacje</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
    </ul>
</nav>
<table>
    <tr>
        <td>Pokój</td>

        <td>Osoby  </td>

        <td>Ceny / noc</td>

    </tr>
    <tr>
        <td>Standard</td>
        <td>2</td>
        <td>  250 zł </td>
    </tr>
    <tr>
        <td>Delux</td>
        <td>2</td>
        <td>  420 zł</td>
    </tr>

    <tr>
        <td>Apartament</td>
        <td>4</td>
        <td>   750 zł</td>
    </tr>

</table>
<br>
<main>
    <form>
        <label for="name">Imię:</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="surname">Nazwisko:</label>
        <input type="text" id="surname" name="surname">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br>
        <label for="phone">Numer telefonu:</label>
        <input type="tel" id="phone" name="phone">
        <br>
        <label for="room">Rodzaj pokoju:</label>
        <select id="room" name="room">
            <option value="standard">Standard</option>
            <option value="deluxe">Deluxe</option>
            <option value="apartament">Apartament</option>
        </select>
        <br>
        <label for="arrival">Data przyjazdu:</label>
        <input type="date" id="arrival" name="arrival">
        <br>
        <label for="departure">Data wyjazdu:</label>
        <input type="number" id="departure" name="departure">
        <br>
        <label for="people">Liczba osób:</label>
        <input type="number" id="people" name="people">
        <br>
        <label for="message">Dodatkowe informacje:</label>
        <textarea id="message" name="message"></textarea>
        <br>
        <input type="checkbox" id="breakfast" name="breakfast">
        <label for="breakfast">Chcę Śniadanie!</label>
        <br>
        <button type="submit">Zarezerwuj</button>
        <br>

    </form>



</main>
</body>
</html>
